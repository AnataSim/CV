services:
  - type: web
    name: crunchyverse-discord-bot
    env: node
    region: singapore
    plan: free
    rootDir: discord-bot
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: DISCORD_TOKEN
        sync: false
      - key: GUILD_ID
        sync: false
      - key: BROADCAST_CHANNEL
        sync: false
      - key: ROLE_KERUPUK
        sync: false
      - key: ROLE_KERIPIK
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: CV_API_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
