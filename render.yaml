services:
  # Next.js Web Frontend
  - type: web
    name: crunchyverse-web
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://crunchyverse-backend.onrender.com

  # Discord Bot API Server
  - type: web
    name: crunchyverse-backend
    runtime: node
    region: singapore
    plan: free
    rootDir: discord-bot
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    autoDeploy: true

